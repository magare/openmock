<!doctype html>
<html>
<body style="margin:0">
<script type="module">
import * as THREE from "three";
import { USDLoader } from "three/examples/jsm/loaders/USDLoader.js";
import { HDRLoader } from "three/examples/jsm/loaders/HDRLoader.js";

const params = new URLSearchParams(location.search);
const model = params.get("model") || "watch-ultra-3";
const mode = params.get("mode") || "asis";

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(900, 900);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, 1, 0.01, 100);
camera.position.set(0, 0, 3.4);
const hemi = new THREE.HemisphereLight(0xffffff, 0x4a4e50, 0.72);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfffaf2, 1.45);
key.position.set(2.2, 4.5, 4.2);
scene.add(key);
const rim = new THREE.DirectionalLight(0xb8d7ff, 0.62);
rim.position.set(-3.5, 1.8, -4);
scene.add(rim);

new HDRLoader().load("/assets/source/brown_photostudio_04_2k.hdr", (t) => {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(t).texture;
});

const loader = new USDLoader();
const group = await loader.loadAsync(`/assets/devices/${model}.usdz`);
group.updateMatrixWorld(true);

group.traverse((o) => {
  if (!o.isMesh || !o.material) return;
  const mats = Array.isArray(o.material) ? o.material : [o.material];
  mats.forEach((m) => {
    if (mode === "no-ao" && m.aoMap) { m.aoMap = null; m.needsUpdate = true; }
    if (mode === "no-normal" && m.normalMap) { m.normalMap = null; m.needsUpdate = true; }
    if (mode === "no-rough" && m.roughnessMap) { m.roughnessMap = null; m.needsUpdate = true; }
    if (mode === "no-metal" && m.metalnessMap) { m.metalnessMap = null; m.needsUpdate = true; }
    if (mode === "no-map" && m.map) { m.map = null; m.needsUpdate = true; }
    if (mode === "channels0") {
      ["map","normalMap","roughnessMap","metalnessMap","aoMap","emissiveMap","clearcoatMap","clearcoatNormalMap","clearcoatRoughnessMap","alphaMap"].forEach((s)=>{ if (m[s]) m[s].channel = 0; });
    }
    if (mode === "scalars") {
      if ("roughness" in m) m.roughness = Math.min(m.roughness, 0.4);
      if ("metalness" in m && m.metalnessMap) { m.metalnessMap = null; }
      m.needsUpdate = true;
    }
    if (mode === "all") {
      m.aoMap = null;
      m.roughnessMap = null;
      m.metalnessMap = null;
      if ("roughness" in m) m.roughness = Math.min(m.roughness, 0.4);
      if ("metalness" in m && m.metalness === 1) m.metalness = 0.85;
      m.needsUpdate = true;
    }
  });
});

const box = new THREE.Box3().setFromObject(group);
const size = box.getSize(new THREE.Vector3());
const center = box.getCenter(new THREE.Vector3());
const maxDim = Math.max(size.x, size.y, size.z);
group.scale.multiplyScalar(2.2 / maxDim);
group.position.sub(center);
group.rotation.y = THREE.MathUtils.degToRad(-24);
scene.add(group);

window.__ready = true;
renderer.render(scene, camera);
</script>
</body>
</html>
